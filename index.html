<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>THE SIXTH MEMBER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Pixelify+Sans:wght@400;600;700&family=DotGothic16&family=ZCOOL+KuaiLe&family=Silkscreen:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&family=Nanum+Pen+Script&family=Caveat:wght@500;700&family=Yomogi&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
/* ===== KEY COLORS =====
   GIRDER GREEN #3E8A4C · CREAM #FFF6E3 · PUFFER BLUE #A9C8E8 · TOMATO RED #E0503F · INK BROWN #3A2A24 */
:root{
  --green:#3E8A4C; --green-d:#2C6838; --green-l:#CFE6C4;
  --cream:#FFF6E3; --blue:#A9C8E8; --blue-l:#E1EDF8; --red:#E0503F; --red-l:#F7D9D2; --brown:#3A2A24;
  --bg:#DDEBCF; --tile:#CBE0BA; --frame:#F4F8EC; --surface:#FFF6E3; --line:#3A2A24; --text:#3A2A24; --muted:#857263; --dot:#C9BBA9;
  --head:"Jua"; --body:"Noto Sans KR"; --pen:"Nanum Pen Script"; --ps:1;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#11211A; --tile:#162B21; --frame:#1B3127; --surface:#24392D; --line:#0A140F; --text:#FFF6E3; --muted:#B4C3AA; --dot:#4A5E4F;
    --green-l:#2E5139; --blue-l:#253C4F; --red-l:#4A2B27; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11211A; --tile:#162B21; --frame:#1B3127; --surface:#24392D; --line:#0A140F; --text:#FFF6E3; --muted:#B4C3AA; --dot:#4A5E4F;
  --green-l:#2E5139; --blue-l:#253C4F; --red-l:#4A2B27; color-scheme:dark;
}
html[lang="en"]{--head:"Pixelify Sans";--pen:"Caveat";--ps:.95}
html[lang="ja"]{--head:"DotGothic16";--body:"Noto Sans JP";--pen:"Yomogi";--ps:.76}
html[lang="zh"]{--head:"ZCOOL KuaiLe";--body:"Noto Sans SC";--pen:"ZCOOL KuaiLe";--ps:.8}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100%;color:var(--text);
  font-family:var(--body),"Noto Sans KR",system-ui,-apple-system,sans-serif;font-size:15.5px;line-height:1.6;-webkit-font-smoothing:antialiased;
  background-color:var(--bg);
  background-image:conic-gradient(from 45deg,var(--tile) 25%,transparent 0 50%,var(--tile) 0 75%,transparent 0);
  background-size:30px 30px;
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.pix{font-family:"Silkscreen",monospace}
.pen,.note .last{font-family:var(--pen),"Nanum Pen Script",cursive}

/* ===== handheld frame ===== */
#app{
  max-width:430px;margin:10px auto;min-height:calc(100vh - 20px);min-height:calc(100dvh - 20px);
  background:var(--frame);border:3px solid var(--line);border-radius:22px;
  box-shadow:0 0 0 5px var(--green),0 0 0 8px var(--line),6px 10px 0 8px rgba(58,42,36,.25);
  padding:58px 16px 28px;display:flex;flex-direction:column;position:relative;
}
@media (max-width:460px){#app{margin:8px 10px;}}
.screen{display:flex;flex-direction:column;flex:1;animation:in .3s steps(4)}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.screen,.caret,.ana-memos .m{animation:none!important;opacity:1}*{transition:none!important}}
.spacer{flex:1;min-height:20px}

/* language */
.lang-wrap{position:fixed;top:calc(env(safe-area-inset-top,0px) + 22px);right:max(28px,calc(50% - 197px));z-index:30}
.lang-btn{border:3px solid var(--line);background:var(--red);color:var(--cream);padding:3px 10px;font-family:var(--head),sans-serif;font-size:14px;display:flex;gap:6px;align-items:center;border-radius:999px;min-height:34px;box-shadow:0 3px 0 var(--line)}
.lang-menu{position:absolute;right:0;top:calc(100% + 8px);background:var(--surface);border:3px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-width:140px;overflow:hidden;box-shadow:0 4px 0 var(--line)}
.lang-menu button{background:none;border:0;text-align:left;padding:11px 14px;font-size:14px;color:var(--text)}
.lang-menu button+button{border-top:2px dashed var(--dot)}
.lang-menu button.on{background:var(--green);color:var(--cream)}

/* top status bar (DS 상단 바) */
.topbar{display:flex;align-items:center;gap:8px;background:var(--brown);color:var(--cream);border:3px solid var(--line);border-radius:999px;padding:4px 14px;font-family:var(--head),sans-serif;font-size:14px;min-height:36px;align-self:flex-start;max-width:100%;white-space:nowrap;overflow:hidden}
.topbar .sep{color:var(--red)}
.topbar .pix{font-size:12px;color:var(--green-l)}
.topbar .ell{overflow:hidden;text-overflow:ellipsis}
.topbar .chap{display:flex;gap:3px}
.topbar .chap i{width:9px;height:9px;background:#6B5A50;border-radius:2px}
.topbar .chap i.on{background:var(--green-l)}

/* dialog box (말풍선/대화창) */
.dialog{position:relative;background:var(--surface);border:3px solid var(--line);border-radius:16px;box-shadow:inset 0 0 0 3px var(--green-l),0 4px 0 var(--line);padding:22px 18px 18px;margin-top:22px}
.dialog .tag{position:absolute;top:-15px;left:14px;background:var(--green);color:var(--cream);border:3px solid var(--line);border-radius:999px;padding:0 12px;font-family:var(--head),sans-serif;font-size:13.5px;line-height:24px;max-width:calc(100% - 28px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dialog .tag.red{background:var(--red)}
.dialog .caret{position:absolute;right:14px;bottom:10px;width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:8px solid var(--red);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.d-main{font-family:var(--head),sans-serif;font-size:18px;line-height:1.5;margin:0 0 6px;word-break:keep-all}
.d-sub{color:var(--muted);font-size:14px;margin:0;word-break:keep-all}

/* buttons */
.btn{display:block;width:100%;border:3px solid var(--line);background:var(--green);color:var(--cream);padding:13px 18px;font-family:var(--head),sans-serif;font-size:18px;border-radius:14px;box-shadow:inset 0 -4px 0 var(--green-d),0 4px 0 var(--line);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:inset 0 -2px 0 var(--green-d),0 1px 0 var(--line)}
.btn.ghost{background:var(--surface);color:var(--text);box-shadow:inset 0 -4px 0 var(--dot),0 4px 0 var(--line)}
.btn[disabled]{opacity:.4;pointer-events:none}
.link{background:none;border:0;padding:10px 0;color:var(--muted);font-size:14px;text-decoration:underline;text-decoration-style:dashed;text-underline-offset:4px}
.link.strong{color:var(--text)}

/* avatar placeholder (픽셀 이미지로 교체 예정) */
.av{display:inline-flex;align-items:flex-end;justify-content:center;flex:none;overflow:hidden;border:3px solid var(--line);border-radius:8px;
  background-color:var(--c);background-image:linear-gradient(90deg,rgba(255,255,255,.18) 50%,transparent 50%),linear-gradient(rgba(255,255,255,.18) 50%,transparent 50%);background-size:8px 8px}
.av img{width:112%;height:112%;object-fit:cover;object-position:50% 0;image-rendering:pixelated;margin-bottom:-14%}
.full{display:block;image-rendering:pixelated;width:auto;max-width:none}
.bust{display:inline-flex;align-items:flex-end;justify-content:center;overflow:hidden;border:3px solid var(--line);border-radius:10px;flex:none;
  background-color:var(--c);background-image:linear-gradient(90deg,rgba(255,255,255,.18) 50%,transparent 50%),linear-gradient(rgba(255,255,255,.18) 50%,transparent 50%);background-size:10px 10px}
.bust img{width:100%;height:100%;object-fit:cover;object-position:50% 0;image-rendering:pixelated}

/* stage (멤버들이 서 있는 무대) */
.stage{position:relative;display:flex;align-items:flex-end;justify-content:center;gap:0;border:3px solid var(--line);border-radius:16px;overflow:hidden;
  padding:14px 6px 10px;margin-top:14px;
  background:linear-gradient(transparent calc(100% - 26px),var(--red) calc(100% - 26px)),
    conic-gradient(from 45deg,var(--green-l) 25%,var(--frame) 0 50%,var(--green-l) 0 75%,var(--frame) 0) 0 0/22px 22px;
  box-shadow:0 4px 0 var(--line)}
.stage::after{content:"";position:absolute;left:0;right:0;bottom:26px;border-top:3px solid var(--line)}
.stage .w{margin:0 -5px;position:relative;z-index:1;text-align:center}
.stage .w figcaption{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);background:var(--cream);color:var(--brown);border:2px solid var(--line);border-radius:999px;padding:0 6px;font-family:var(--head),sans-serif;font-size:11px;line-height:17px;white-space:nowrap;z-index:2}
.stage .empty-slot,.stage .you-slot{position:relative;z-index:1;align-self:flex-end;margin:0 4px 6px;width:46px;border:3px dashed var(--line);border-radius:24px 24px 8px 8px;display:flex;align-items:center;justify-content:center;font-family:"Silkscreen";font-size:20px;color:var(--red);background:rgba(255,246,227,.7)}
.stage .you-slot{border-style:solid;background:var(--red);color:var(--cream);width:56px;box-shadow:0 0 0 3px var(--cream) inset}
.stage .you-slot span{writing-mode:vertical-rl;font-family:var(--head),sans-serif;font-size:14px;letter-spacing:.05em;max-height:90%;overflow:hidden}
.stage.watch{padding:8px 6px 6px;margin-top:12px;border-radius:12px}
.stage.watch::after{bottom:18px}
.stage.watch{background:linear-gradient(transparent calc(100% - 18px),var(--red) calc(100% - 18px)),conic-gradient(from 45deg,var(--green-l) 25%,var(--frame) 0 50%,var(--green-l) 0 75%,var(--frame) 0) 0 0/16px 16px}
.stage.watch .w{margin:0 2px;transition:transform .15s steps(2)}
.stage.watch .w.writing{transform:translateY(-4px)}
.stage.watch .w.writing::before{content:"✎";position:absolute;top:-2px;right:-8px;background:var(--cream);border:2px solid var(--line);border-radius:999px;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:12px;z-index:3;color:var(--red)}

/* day host & note bubble scenes */
.host,.note-say{display:flex;align-items:flex-end;gap:4px;margin-top:6px}
.host .full,.note-say .full{flex:none;filter:drop-shadow(3px 3px 0 rgba(58,42,36,.25))}
.host .bubble,.note-say .bubble{flex:1;margin:0 0 40px 0;padding:20px 14px 16px}
.host .bubble::before,.note-say .bubble::before{content:"";position:absolute;left:-13px;bottom:22px;border:8px solid transparent;border-right:12px solid var(--line)}
.note-say .pen{font-size:calc(25px*var(--ps));line-height:1.25}
.note-say{margin-top:14px}

/* tiles (どうぶつの森 타이틀처럼 글자 타일) */
.tiles{display:flex;gap:4px;flex-wrap:wrap}
.tiles .tl{display:inline-flex;align-items:center;justify-content:center;font-family:"Silkscreen",monospace;font-weight:700;border:3px solid var(--line);border-radius:7px;box-shadow:0 3px 0 var(--line);color:var(--brown)}
.tiles .gap{width:10px}
.tiles .t0{background:var(--green-l);transform:rotate(-3deg)}
.tiles .t1{background:var(--red-l);transform:rotate(2deg)}
.tiles .t2{background:var(--cream);transform:rotate(-1deg)}
.tiles .t3{background:var(--red);color:var(--cream);transform:rotate(3deg)}
.tiles.sm .tl{width:26px;height:26px;font-size:13px}
.tiles.md .tl{width:42px;height:42px;font-size:20px}
.tiles.lg .tl{width:58px;height:58px;font-size:30px}
.tiles.xl .tl{width:62px;height:62px;font-size:30px}
@media (max-width:380px){.tiles.lg .tl{width:50px;height:50px;font-size:26px}.tiles.md .tl{width:36px;height:36px;font-size:17px}.tiles.xl .tl{width:52px;height:52px;font-size:25px}}

/* intro */
.title{display:flex;flex-direction:column;gap:10px;margin:28px 0 6px;align-items:flex-start}
.crew-row{display:flex;gap:8px;margin:26px 0 8px;align-items:center}
.crew-row .slot{width:50px;height:50px;border:3px dashed var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:"Silkscreen";font-size:20px;color:var(--red);background:var(--surface)}
.crew-cap{font-size:13px;color:var(--muted);margin:0}
.disclaimer{font-size:11.5px;color:var(--muted);line-height:1.5;margin:16px 0 0}

/* name */
.h2{font-family:var(--head),sans-serif;font-weight:400;font-size:24px;line-height:1.35;margin:0 0 6px;word-break:keep-all}
.field{display:flex;align-items:center;gap:10px;margin-top:22px;background:var(--surface);border:3px solid var(--line);border-radius:14px;padding:4px 14px;box-shadow:inset 0 3px 0 var(--dot)}
.name-input{flex:1;min-width:0;font-family:var(--head),sans-serif;font-size:22px;border:0;background:transparent;color:var(--text);padding:10px 0}
.name-input:focus{outline:none}
.field:focus-within{outline:3px solid var(--red);outline-offset:2px}
.name-input::placeholder{color:var(--dot)}
.count{font-family:"Silkscreen";font-size:12px;color:var(--muted)}

/* brief */
.brief-members{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:24px 0 4px}
.brief-members figure{margin:0;text-align:center;font-family:var(--head),sans-serif;font-size:12.5px}
.brief-members figcaption{margin-top:4px}
.dialog .pen{font-size:calc(26px*var(--ps));line-height:1.25;margin:0 0 10px}

/* day */
.day-screen{justify-content:center}
.day-badge{align-self:flex-start;background:var(--red-l);border:3px solid var(--line);border-radius:999px;padding:2px 12px;font-family:"Silkscreen";font-size:12px;color:var(--brown);margin-bottom:14px}
.day-title-tiles{margin-bottom:10px}
.day-screen .btn{margin-top:30px}

/* question */
.status{display:flex;align-items:center;gap:10px;margin-top:12px}
.hp{flex:1;height:14px;background:var(--brown);border:3px solid var(--line);border-radius:999px;overflow:hidden;position:relative}
.hp i{position:absolute;inset:0 auto 0 0;background:var(--green);border-right:3px solid var(--green-l);transition:width .3s}
.hearts{display:flex;gap:2px}
.hrt{width:13px;height:11px;display:block;fill:var(--dot)}
.hearts .on .hrt{fill:var(--red)}
.qtext{font-family:var(--head),sans-serif;font-size:19px;line-height:1.55;margin:0;word-break:keep-all}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;width:100%;background:var(--surface);border:3px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15.5px;line-height:1.45;word-break:keep-all;box-shadow:0 4px 0 var(--line);transition:transform .08s,box-shadow .08s,background .1s}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.opt .k{font-family:"Silkscreen";font-weight:700;flex:none;width:26px;height:26px;display:flex;align-items:center;justify-content:center;border:3px solid var(--line);border-radius:6px;font-size:12px;background:var(--red-l);color:var(--brown)}
.opt.sel{background:var(--green);color:var(--cream);transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.opt.sel .k{background:var(--red);color:var(--cream)}
.qfoot{margin-top:auto;padding-top:18px;display:flex;justify-content:space-between;align-items:center}
.react{display:flex;gap:10px;align-items:flex-start;margin-top:8px;animation:in .3s steps(4)}
.react .bubble{flex:1;margin-top:22px;padding:18px 14px 12px}
.react .pen{font-size:calc(23px*var(--ps));line-height:1.25}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;
  background:var(--brown);color:var(--cream);border:3px solid var(--line);border-radius:14px;box-shadow:inset 0 0 0 3px var(--red),0 4px 0 var(--line);
  padding:10px 14px;display:flex;gap:10px;align-items:center;font-size:13.5px;max-width:400px;width:calc(100% - 44px);transition:.2s steps(3);z-index:40}
.toast .av{border-color:var(--cream)}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* analysis */
.ana{justify-content:center}
.ana-memos{position:relative;height:220px;width:100%;margin-bottom:24px}
.ana-memos .m{position:absolute;width:118px;height:88px;background:var(--surface);border:3px solid var(--line);border-radius:6px;opacity:0;animation:drop .35s steps(4) forwards}
.ana-memos .m:nth-child(3n){background:var(--red-l)}
.ana-memos .m::before{content:"";position:absolute;top:-9px;left:34px;width:46px;height:14px;background:var(--red);opacity:.8}
@keyframes drop{from{opacity:0;transform:translateY(-30px) rotate(var(--r))}to{opacity:1;transform:rotate(var(--r))}}
.ana-line{font-size:15px;min-height:24px;color:var(--muted)}
.ana .h2{margin-bottom:6px}

/* results common */
.rtitle{font-family:var(--head),sans-serif;font-weight:400;font-size:23px;line-height:1.35;margin:22px 0 4px;word-break:keep-all}
.rsub{color:var(--muted);font-size:14px;margin:0 0 18px;word-break:keep-all}
.rnav{display:flex;gap:10px;margin-top:auto;padding-top:24px}
.rnav .btn{flex:1}
.rnav .btn.ghost{flex:0 0 96px}
.pill{display:inline-block;background:var(--brown);color:var(--cream);border-radius:999px;padding:1px 10px;font-family:var(--head),sans-serif;font-size:12.5px;line-height:22px;white-space:nowrap}
.sec-label{font-family:var(--head),sans-serif;font-size:15px;margin:8px 0 10px;display:flex;align-items:center;gap:8px}
.sec-label::before{content:"";width:12px;height:12px;background:var(--red);border:3px solid var(--line);border-radius:3px;flex:none}
.sec-label::after{content:"";flex:1;border-top:3px dotted var(--line)}
.fine{font-size:11.5px;color:var(--muted);margin-top:10px}

/* memos */
.memo-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 12px;margin-top:6px}
.memo{background:var(--surface);border:3px solid var(--line);border-radius:6px;padding:16px 10px 10px;position:relative;font-size:12px;box-shadow:0 3px 0 var(--line)}
.memo:nth-child(4n+2),.memo:nth-child(4n+3){background:var(--red-l)}
.memo::before{content:"";position:absolute;top:-10px;left:50%;transform:translateX(-50%) rotate(-3deg);width:52px;height:15px;background:var(--red);opacity:.85}
.memo:nth-child(odd){transform:rotate(-1.4deg)}
.memo:nth-child(even){transform:rotate(1.2deg)}
.memo .by{display:flex;align-items:center;gap:6px;font-family:var(--head),sans-serif;font-size:13.5px;margin-bottom:6px}
.memo .by .av{border-width:2px;border-radius:5px}
.memo .sc{color:var(--muted);line-height:1.4}
.memo .pen{font-size:calc(20px*var(--ps));line-height:1.2;display:block;margin-top:6px}

/* profile (DS 프로필 창) */
.profile{display:flex;gap:14px;align-items:center;margin-top:18px;background:var(--green-l);border:3px solid var(--line);border-radius:14px;padding:12px;box-shadow:0 4px 0 var(--line)}
.pf-photo{padding:5px;line-height:0;border:3px solid var(--line);border-radius:10px;
  background-color:var(--red);background-image:linear-gradient(90deg,rgba(58,42,36,.35) 50%,transparent 50%),linear-gradient(rgba(58,42,36,.35) 50%,transparent 50%);background-size:10px 10px}
.pf-info h3{font-family:var(--head),sans-serif;font-weight:400;font-size:21px;margin:6px 0 2px;line-height:1.3}
.pf-info p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.4}
.note{margin-top:22px;padding:18px 16px 16px}
.note dt{display:inline-block;font-family:var(--head),sans-serif;font-size:13px;color:var(--cream);background:var(--green);border-radius:999px;padding:0 10px;margin-top:14px;line-height:22px}
.note dt:first-child{margin-top:0}
.note dd{margin:6px 0 0;font-size:15px;line-height:1.6;word-break:keep-all}
.note .scene{border-left:4px solid var(--red);padding-left:10px}
.note .scene q{font-family:var(--head),sans-serif}
.note .last{font-size:calc(26px*var(--ps));line-height:1.25}

/* consensus */
.agree{background:var(--surface);border:3px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;box-shadow:0 3px 0 var(--line)}
.agree .faces{display:flex;gap:4px;margin-bottom:8px}
.agree .faces .off{opacity:.25}
.agree strong{font-family:var(--head),sans-serif;font-weight:400;font-size:17px;word-break:keep-all}
.split{border:3px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden;box-shadow:0 3px 0 var(--line)}
.split .sides{display:grid;grid-template-columns:1fr 1fr}
.split .side{padding:12px;font-family:var(--head),sans-serif;font-size:14.5px;word-break:keep-all;background:var(--green-l)}

.hidden-item{padding:14px 0;border-bottom:3px dotted var(--dot)}
.hidden-item h4{margin:0 0 4px;font-family:var(--head),sans-serif;font-weight:400;font-size:17px;word-break:keep-all}
.hidden-item p{margin:0;font-size:14.5px;word-break:keep-all}
.hidden-item .ev{font-size:12px;color:var(--muted);margin-top:6px}

/* identity */
.id-pre{font-size:14.5px;color:var(--muted);margin:22px 0 10px}
.id-plaque{background:var(--green);border:3px solid var(--line);border-radius:16px;box-shadow:inset 0 0 0 3px var(--green-l),0 5px 0 var(--line);padding:16px 16px 14px;color:var(--cream)}
.id-name{font-family:"Silkscreen",monospace;font-weight:700;font-size:30px;line-height:1.05;word-break:break-word}
.id-kr{display:inline-block;margin-top:8px;background:var(--cream);color:var(--brown);border:3px solid var(--line);border-radius:999px;padding:0 10px;font-family:var(--head),sans-serif;font-size:14px}
.id-one{font-family:var(--head),sans-serif;font-size:19px;margin:18px 0 6px;word-break:keep-all}
.id-desc{font-size:15px;margin:0 0 14px;word-break:keep-all}
.id-sub{font-size:13.5px;padding:10px 0 4px;margin-bottom:18px;border-top:3px dotted var(--dot);word-break:keep-all}
.dna{background:var(--surface);border:3px solid var(--line);border-radius:14px;padding:6px 12px;box-shadow:0 4px 0 var(--line)}
.dna-row{display:grid;grid-template-columns:1fr auto;gap:4px 8px;align-items:center;padding:9px 0}
.dna-row+.dna-row{border-top:2px dashed var(--dot)}
.dna-row .pill{justify-self:start}
.dna-row .v{font-family:"Silkscreen";font-size:14px}
.slots{grid-column:1/3;display:flex;align-items:center;gap:3px;background:var(--brown);border-radius:999px;padding:4px 8px}
.slots i{flex:1;height:10px;border-radius:2px;background:#6B5A50}
.slots i.on{background:var(--green-l);box-shadow:inset 0 -3px 0 var(--green)}
.dna-row .ds{grid-column:1/3;font-size:12px;color:var(--muted)}

/* strength */
.sb-block{margin-bottom:18px}
.sb-item{border:3px solid var(--line);border-radius:12px;background:var(--green-l);padding:12px 14px;margin-bottom:10px;box-shadow:0 3px 0 var(--line)}
.sb-item.blind{background:var(--red-l);border-style:dashed}
.sb-item h4{margin:0 0 4px;font-family:var(--head),sans-serif;font-weight:400;font-size:16.5px;word-break:keep-all}
.sb-item p{margin:0;font-size:14px;word-break:keep-all}

/* match */
.match{display:flex;gap:12px;align-items:flex-start;border:3px solid var(--line);border-radius:14px;background:var(--surface);padding:14px 12px 12px;margin:20px 0 6px;position:relative;box-shadow:0 4px 0 var(--line)}
.match .lab{position:absolute;top:-15px;left:12px;background:var(--red);color:var(--cream);border:3px solid var(--line);border-radius:999px;padding:0 10px;font-family:var(--head),sans-serif;font-size:12px;line-height:22px;white-space:nowrap;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis}
.match h4{margin:4px 0 4px;font-family:var(--head),sans-serif;font-weight:400;font-size:19px}
.match p{margin:0;font-size:14px;word-break:keep-all}
.match.soul{background:var(--green-l)}

.share-wrap{display:flex;justify-content:center;margin:18px 0 16px}

  background-color:#E3EFD8;background-image:linear-gradient(45deg,#CFE6C4 25%,transparent 25%,transparent 75%,#CFE6C4 75%),linear-gradient(45deg,#CFE6C4 25%,transparent 25%,transparent 75%,#CFE6C4 75%);background-size:22px 22px;background-position:0 0,11px 11px;
  font-family:var(--body),"Noto Sans KR",sans-serif}
.card .c-bar{display:flex;gap:6px;justify-content:center;background:#3A2A24;color:#FFF6E3;border-radius:999px;padding:4px 10px;font-family:"Silkscreen",monospace;font-size:9.5px}
.card .c-bar span:nth-child(2){color:#E0503F}
.card .c-title{font-family:var(--head),sans-serif;font-size:24px;line-height:1.2;text-align:center;color:#3A2A24;text-shadow:2px 2px 0 #FFF6E3;margin-top:4px;word-break:keep-all}
.card .c-sub{align-self:center;text-align:center;background:#E0503F;color:#FFF6E3;border:2px solid #3A2A24;border-radius:10px;padding:3px 10px;font-family:var(--head),sans-serif;font-size:12px;line-height:1.4;word-break:keep-all;max-width:100%}
.card .c-scene{position:relative;display:flex;align-items:flex-end;border:3px solid #3A2A24;border-radius:14px;overflow:hidden;height:214px;padding:0 10px 0 6px;
  background:linear-gradient(transparent 182px,#E0503F 182px),linear-gradient(45deg,#FFF6E3 25%,transparent 25%,transparent 75%,#FFF6E3 75%),linear-gradient(45deg,#FFF6E3 25%,transparent 25%,transparent 75%,#FFF6E3 75%);
  background-color:#F7D9D2;background-size:auto,18px 18px,18px 18px;background-position:0 0,0 0,9px 9px}
.card .c-scene::after{content:"";position:absolute;left:0;right:0;top:182px;border-top:3px solid #3A2A24}
.card .c-char{position:relative;z-index:1;flex:none;margin-bottom:6px}
.card .c-char .full{filter:drop-shadow(3px 3px 0 rgba(58,42,36,.3))}
.card .c-bubble{position:relative;z-index:1;align-self:flex-start;margin:16px 0 0 2px;background:#FFF6E3;border:3px solid #3A2A24;border-radius:14px;box-shadow:inset 0 0 0 3px #CFE6C4,0 3px 0 #3A2A24;padding:20px 10px 10px;flex:1}
.card .c-bubble::before{content:"";position:absolute;left:-14px;top:52px;border:7px solid transparent;border-right:12px solid #3A2A24}
.card .c-who{position:absolute;top:-12px;left:8px;background:#3E8A4C;color:#FFF6E3;border:2px solid #3A2A24;border-radius:999px;padding:0 8px;font-family:"Silkscreen",monospace;font-size:8.5px;line-height:18px;white-space:nowrap}
.card .c-bubble .pen{display:block;font-size:calc(20px*var(--ps));line-height:1.2;word-break:keep-all}
.card .c-list{display:flex;flex-direction:column;gap:5px}
.card .q{display:flex;gap:7px;align-items:center;background:#CFE6C4;border:2px solid #3A2A24;border-radius:10px;padding:3px 8px 3px 4px;font-size:11.5px;word-break:keep-all;line-height:1.3}

.card .q .av{border-width:2px;border-radius:6px;border-color:#3A2A24}
.card .c-type{background:#3E8A4C;color:#FFF6E3;border:3px solid #3A2A24;border-radius:12px;box-shadow:inset 0 0 0 2px #CFE6C4;padding:6px 12px;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px}

.share-actions{display:flex;flex-direction:column;gap:12px}
.share-msg{font-size:13px;color:var(--muted);text-align:center;min-height:20px;margin:0}

  lo:{tag:"the one who stays firm once decided",find:"You don’t decide easily, but once you do, you rarely change it. That’s your strength.",exp:"Before a big decision, I’d always want to hear your opinion.",wor:"But when the thinking runs long, the chance can pass first.",line:"{n}, take your time. Just don’t worry over it alone for too long."}},

  const slot=opts.player?me:(opts.empty?`<span class="empty-slot" style="height:${Math.round(h*.78)}px">?</span>`:"");

}

  const lb=$("#lb"),lm=$("#lm");
  lb.onclick=e=>{e.stopPropagation();lm.hidden=!lm.hidden;lb.setAttribute("aria-expanded",!lm.hidden)};
  lm.querySelectorAll("button").forEach(b=>b.onclick=()=>setLang(b.dataset.l));
}

/* ---------- 상태 ---------- */
let S;
function reset(){S={look:"s",name:"",i:0,ans:Array(QD.length).fill(null),memos:new Set(),days:new Set(),res:null,r:0,view:null}}
reset();

/* ---------- 인트로 ---------- */
/* ---------- 질문 ---------- */
function advance(i){i<QD.length-1?showQ(i+1):analysis()}

/* ---------- 계산 (언어와 무관한 키만 저장) ---------- */
function compute(){
  const raw={},lo={},hi={};AX.forEach(a=>{raw[a]=0;lo[a]=0;hi[a]=0});
  QD.forEach((q,i)=>{
    const sc=q.s.map(parse);
    AX.forEach(a=>{const vs=sc.map(s=>s[a]||0);lo[a]+=Math.min(...vs);hi[a]+=Math.max(...vs)});
    const s=sc[S.ans[i]];AX.forEach(a=>raw[a]+=s[a]||0);
  });
  const score={};AX.forEach(a=>{const r=(raw[a]-lo[a])/(hi[a]-lo[a]);score[a]=Math.max(3,Math.min(97,Math.round(50+(r-.45)*170)))});
  const vec=AX.map(a=>score[a]);

  const lens={};
  ORDER.forEach(id=>{
    const t={L:0,S:0,X:0};
    MEMBER[id].ev.forEach(i=>{const g=parse(QD[i].g[S.ans[i]]);for(const k in t)t[k]+=g[k]||0});
    lens[id]={L:Math.sign(t.L),S:Math.sign(t.S),X:Math.sign(t.X)};
  });

  const used=new Set(),notes={};
  ORDER.forEach(id=>{
    const m=MEMBER[id],key=m.key,isLens=["L","S","X"].includes(key);
    let best=null,bv=-1;
    m.ev.forEach(i=>{if(used.has(i))return;const v=Math.abs(parse(isLens?QD[i].g[S.ans[i]]:QD[i].s[S.ans[i]])[key]||0);if(v>bv){bv=v;best=i}});
    if(best===null)best=m.ev[0];used.add(best);
    let level;
    if(isLens){const s=lens[id][key];level=s>0?"hi":s<0?"lo":"mid"}
    else{const v=score[key];level=v>=62?"hi":v<=40?"lo":"mid"}
    notes[id]={scene:best,level};
  });

  const agree=[],split=[];
  ["L","S","X"].forEach(d=>{
    const p=ORDER.filter(id=>lens[id][d]>0),n=ORDER.filter(id=>lens[id][d]<0);
    if(p.length>=2&&n.length>=2)split.push({d,p,n});
    else if(p.length>=3&&n.length<=1)agree.push({d,side:1,ids:p,c:p.length});
    else if(n.length>=3&&p.length<=1)agree.push({d,side:-1,ids:n,c:n.length});
  });
  agree.sort((a,b)=>b.c-a.c);

  const hidden=split.map(s=>({k:"split",s}));
  const rules=[
    [score.EM>=65&&score.EX<=40,["EM","EX"]],
    [score.CR>=65&&score.EC<=40,["CR","EC"]],
    [score.SE<=42&&QD[21].praise.includes(S.ans[21]),["SE"],"praise"],
    [score.DM>=65&&S.ans[13]===2,["DM"],"deadline"],
    [score.EX>=65&&score.SE<=42,["EX","SE"]]
  ];
  rules.forEach((r,k)=>{if(r[0]&&hidden.length<3)hidden.push({k:"rule",r:k,ax:r[1],x:r[2]})});
  const sorted=[...AX].sort((a,b)=>score[b]-score[a]);
  if(!hidden.length)hidden.push({k:"fb",top:sorted[0],bot:sorted[5]});

  const ctr=a=>{const m=a.reduce((x,y)=>x+y,0)/a.length;return a.map(v=>v-m)};
  const dist=(a,b)=>{const A=ctr(a),B=ctr(b);return Math.sqrt(A.reduce((t,v,k)=>t+(v-B[k])**2,0))};
  const ranked=TYPES.map(t=>({t,d:dist(vec,t.p)-(TYPE_BIAS[t.id]||0)})).sort((a,b)=>a.d-b.d);

  const md=ORDER.map(id=>({id,d:dist(vec,MEMBER[id].prof)-(SOUL_BIAS[id]||0)})).sort((a,b)=>a.d-b.d);
  const soul=md[0].id;
  const asc=[...AX].sort((a,b)=>score[a]-score[b]);
  let growth=null,gAxis=null;
  for(const a of asc){if(GROWTH_BY_AXIS[a]!==soul){growth=GROWTH_BY_AXIS[a];gAxis=a;break}}
  const oc=md.filter(x=>x.id!==soul&&x.id!==growth);
  const opp=oc[oc.length-1].id;
  const gap=(id,a)=>Math.abs(score[a]-MEMBER[id].prof[AX.indexOf(a)]);
  const soulAx=[...AX].sort((a,b)=>gap(soul,a)-gap(soul,b)).slice(0,2);
  const oppAx=[...AX].sort((a,b)=>gap(opp,b)-gap(opp,a))[0];

  return {score,lens,notes,agree,split,hidden,main:ranked[0].t.id,sub:ranked[1].t.id,strengths:sorted.slice(0,2),soul,growth,gAxis,opp,soulAx,oppAx};
}
const lvl=v=>v>=62?2:v<=40?0:1;
function lensLabel(d,side){return side>0?T().lens[d].p:T().lens[d].n}
function headline(R){
  const L=T();
  if(R.agree.length&&R.agree[0].c>=4){const a=R.agree[0];return L.headAgree(a.c,L.quote(lensLabel(a.d,a.side)))}
  if(R.split.length){const s=R.split[0];return L.headSplit(L.quote(L.lens[s.d].p),L.quote(L.lens[s.d].n))}
  return L.headElse(L.types[R.main].one);
}
function hiddenText(h,R){
  const L=T();
  if(h.k==="split"){
    const s=h.s,ln=L.lens[s.d];
    const cp=s.p.map(id=>L.members[id].ctx).join(L.ctxJoin),cn=s.n.map(id=>L.members[id].ctx).join(L.ctxJoin);
    return {h:L.splitTitle(names(s.p),names(s.n)),p:L.splitBody(cp,cn,ln.vp,ln.vn)+(L.tailSep??" ")+L.splitTail,
      ev:U("evLab")+s.p.concat(s.n).map(id=>`${mn(id)} – ${qt(R.notes[id].scene).sc}`).join(" / ")};
  }
  if(h.k==="rule"){
    const r=L.rules[h.r];
    const ev=h.ax.map(a=>`${L.axn[a]} ${R.score[a]}`).concat(h.x?[L.ui[h.x]]:[]).join(" · ");
    return {h:r.h,p:r.p,ev:U("evLab")+ev};
  }
  const f=L.fb(L.axn[h.top],L.axn[h.bot]);
  return {h:f.h,p:f.p,ev:U("evLab")+`${L.axn[h.top]} ${R.score[h.top]} · ${L.axn[h.bot]} ${R.score[h.bot]}`};
}

const CHAPTER=p=>({memo:1,consensus:3,identity:4,sb:5,match:6}[p]||2);
function pageMemo(R){
  const grouped=ORDER.flatMap(id=>Object.keys(MEMO_AT).filter(k=>MEMO_AT[k]===id).map(Number));
  return `<h2 class="rtitle">${U("memoT")}</h2>
  <p class="rsub">${U("memoS")}</p>
  <div class="memo-grid">${grouped.map(i=>{const id=MEMO_AT[i];return `<div class="memo"><div class="by">${av(id,22)}${mn(id)}</div><div class="sc">DAY ${QD[i].d} · ${qt(i).sc}</div><span class="pen">${T().quote(qt(i).o[S.ans[i]])}</span></div>`}).join("")}</div>`;
}
function faces(ids){return ORDER.map(id=>`<span class="${!ids.includes(id)?"off":""}">${av(id,26)}</span>`).join("")}
function pageConsensus(R){
  const L=T();
  const ag=R.agree.length?R.agree.map(a=>`<div class="agree"><div class="faces">${faces(a.ids)}</div><strong>${U("agreeTxt",{c:a.c,q:L.quote(lensLabel(a.d,a.side))})}</strong></div>`).join("")
    :`<p style="font-size:14px;color:var(--muted)">${U("noAgree")}</p>`;
  const sp=R.split.length?R.split.map(s=>`<div class="split"><div class="sides">
      <div class="side"><div class="faces">${s.p.map(id=>av(id,26)).join("")}</div>${L.lens[s.d].p}</div>
      <div class="side"><div class="faces">${s.n.map(id=>av(id,26)).join("")}</div>${L.lens[s.d].n}</div></div></div>`).join("")
    :`<div class="agree"><strong>${U("same")}</strong><p style="margin:4px 0 0;font-size:14px">${U("sameS")}</p></div>`;
  return `<h2 class="rtitle">${U("consT")}</h2>
  <p class="rsub">${U("consS")}</p>
  <div class="sec-label">${U("agreeL")}</div>${ag}
  <div class="sec-label" style="margin-top:18px">${U("splitL")}</div>${sp}
  <div class="sec-label" style="margin-top:18px">${U("hidL")}</div>
  ${R.hidden.map(h=>{const x=hiddenText(h,R);return `<div class="hidden-item"><h4>${x.h}</h4><p>${x.p}</p><div class="ev">${x.ev}</div></div>`}).join("")}`;
}
function pageSB(R){
  const SB=T().sb;
  return `<h2 class="rtitle">${U("sbT")}</h2>
  <p class="rsub">${U("sbS")}</p>
  <div class="sb-block"><div class="sec-label">${U("weapon")}</div>${R.strengths.map(a=>`<div class="sb-item"><h4>${SB[a].s[0]}</h4><p>${SB[a].s[1]}</p></div>`).join("")}</div>
  <div class="sb-block"><div class="sec-label">${U("blind")}</div>${R.strengths.map(a=>`<div class="sb-item blind"><h4>${SB[a].b[0]}</h4><p>${SB[a].b[1]}</p></div>`).join("")}</div>`;
}
/* ---------- 공유 카드 ---------- */
function xUrl(R){
  const tags=LANG==="ko"?"#THE_SIXTH_MEMBER #CORTIS #코르티스":"#THE_SIXTH_MEMBER #CORTIS";
  const text=`${U("cardTitle")}
${headline(R).replace(/<[^>]+>/g,"")}
MAIN ROLE: THE ${R.main}

${tags}`;
  let link="";try{const h=location.hostname;if(location.protocol==="https:"&&!/claude|anthropic/.test(h))link=location.origin+location.pathname}catch(e){}
  return "https://twitter.com/intent/tweet?text="+encodeURIComponent(text)+(link?"&url="+encodeURIComponent(link):"");
}
async function cardBlob(){
  const canvas=await html2canvas($("#card"),{scale:3,backgroundColor:null,useCORS:true});
  return await new Promise(r=>canvas.toBlob(r,"image/png"));
}
async function saveCard(){
  const msg=$("#msg");
  if(typeof html2canvas!=="function"){msg.textContent=U("noLib");return}
  msg.textContent=U("making");
  let blob;
  try{blob=await cardBlob()}catch(e){msg.textContent=U("fail");return}
  const fname="the-sixth-member.png";
  // 1) claude.ai 아티팩트 안: downloads 기능 사용
  let dl=null;
  try{if(window.claude&&typeof window.claude.use==="function")dl=await window.claude.use("downloads")}catch(e){dl=null}
  if(dl){
    try{await dl.save({filename:fname,data:blob});msg.textContent=U("saved");}
    catch(err){msg.textContent=err&&err.code==="declined"?"":U("fail")}
    return;
  }
  // 2) 배포 사이트(Vercel 등): 모바일은 공유 시트, 데스크톱은 다운로드
  try{
    const file=new File([blob],fname,{type:"image/png"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:"THE SIXTH MEMBER"});msg.textContent=U("shared");return}
  }catch(e){if(e&&e.name==="AbortError"){msg.textContent="";return}}
  try{const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=fname;document.body.appendChild(a);a.click();a.remove();msg.textContent=U("saved")}
  catch(e){msg.textContent=U("fail")}
}

document.documentElement.lang=LANG;
langBar();
intro();
